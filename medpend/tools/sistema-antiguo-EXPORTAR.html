<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pendientes · Medicamentos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F1F4F2;
    --paper-raised:#FFFFFF;
    --ink:#16221D;
    --ink-soft:#4B5A53;
    --line:#DCE3DE;
    --teal:#1F4B43;
    --teal-deep:#123028;
    --amber:#B5651D;
    --amber-soft:#F3E1CE;
    --gold:#8A6D1A;
    --gold-soft:#F0E6C6;
    --sage:#3F7A5C;
    --sage-soft:#DCEBE1;
    --danger:#A23B2E;
    --danger-soft:#F4DDD7;
    --radius-s:6px;
    --radius-m:10px;
    --shadow: 0 1px 2px rgba(18,48,40,0.06), 0 4px 16px rgba(18,48,40,0.05);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    font-size:14px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{
    font-family:'Fraunces',serif;
    font-weight:600;
    margin:0;
    letter-spacing:-0.01em;
  }
  #app{min-height:100vh;display:flex;flex-direction:column;}

  /* Top bar */
  .topbar{
    background:var(--teal-deep);
    color:#EDF3EF;
    padding:20px 28px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
  }
  .topbar .brand{display:flex;flex-direction:column;gap:2px;}
  .topbar .brand h1{font-size:22px;color:#fff;}
  .topbar .brand span{font-size:12.5px;color:#AFC4B9;}
  .btn{
    border:none;
    border-radius:var(--radius-s);
    padding:10px 16px;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:13.5px;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:6px;
    transition:transform .12s ease, box-shadow .12s ease, background .12s ease;
  }
  .btn:active{transform:translateY(1px);}
  .btn-primary{background:var(--amber);color:#fff;}
  .btn-primary:hover{background:#9C5518;}
  .btn-ghost{background:rgba(255,255,255,0.08);color:#EDF3EF;border:1px solid rgba(255,255,255,0.18);}
  .btn-ghost:hover{background:rgba(255,255,255,0.15);}
  .btn-outline{background:transparent;color:var(--teal);border:1px solid var(--line);}
  .btn-outline:hover{border-color:var(--teal);}
  .btn-sm{padding:6px 10px;font-size:12.5px;}
  .btn-icon{padding:7px;border-radius:var(--radius-s);}

  /* Stats row */
  .stats{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
    gap:14px;
    padding:20px 28px 0;
  }
  .stat-card{
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:var(--radius-m);
    padding:16px 18px;
    box-shadow:var(--shadow);
  }
  .stat-card .num{font-family:'Fraunces',serif;font-size:28px;font-weight:600;color:var(--teal-deep);}
  .stat-card .lbl{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
  .stat-card.urgent .num{color:var(--danger);}
  .stat-card.warn .num{color:var(--amber);}

  /* Controls */
  .controls{
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
    padding:18px 28px 0;
  }
  .search-box{
    flex:1;
    min-width:220px;
    display:flex;
    align-items:center;
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:var(--radius-s);
    padding:9px 12px;
    gap:8px;
  }
  .search-box input{
    border:none;outline:none;background:transparent;width:100%;
    font-family:'Inter',sans-serif;font-size:13.5px;color:var(--ink);
  }
  .tabs{display:flex;gap:6px;flex-wrap:wrap;}
  .tab{
    padding:8px 14px;
    border-radius:999px;
    border:1px solid var(--line);
    background:var(--paper-raised);
    color:var(--ink-soft);
    font-size:13px;
    font-weight:600;
    cursor:pointer;
  }
  .tab.active{background:var(--teal);color:#fff;border-color:var(--teal);}

  /* View switch (Medicamentos / Empleados) */
  .view-switch{
    display:flex;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.18);
    border-radius:999px;padding:3px;gap:2px;
  }
  .view-btn{
    border:none;background:transparent;color:#CBDACF;font-family:'Inter',sans-serif;
    font-weight:600;font-size:12.5px;padding:7px 14px;border-radius:999px;cursor:pointer;
    transition:background .12s ease,color .12s ease;
  }
  .view-btn.active{background:#fff;color:var(--teal-deep);}

  /* Empleado cards */
  .emp-card{
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:var(--radius-m);
    padding:14px 16px;
    display:grid;
    grid-template-columns:1.4fr 1fr 1fr auto;
    gap:14px;
    align-items:center;
    box-shadow:var(--shadow);
  }
  .emp-card.inactivo{opacity:0.55;}
  .emp-card .name{font-weight:700;font-size:14.5px;color:var(--ink);}
  .emp-card .sub{font-size:12.5px;color:var(--ink-soft);}
  @media (max-width:880px){
    .emp-card{grid-template-columns:1fr;}
  }

  /* Main content */
  .content{padding:18px 28px 60px;flex:1;}
  .empty{
    text-align:center;padding:60px 20px;color:var(--ink-soft);
    background:var(--paper-raised);border:1px dashed var(--line);border-radius:var(--radius-m);
  }
  .empty h3{color:var(--ink);margin-bottom:6px;}

  .list{display:flex;flex-direction:column;gap:10px;}
  .row-card{
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:var(--radius-m);
    padding:14px 16px;
    display:grid;
    grid-template-columns:1.6fr 1.3fr 1fr 0.9fr 0.9fr auto;
    gap:14px;
    align-items:center;
    box-shadow:var(--shadow);
  }
  .row-card.entregado{opacity:0.62;}
  .cell-title{display:flex;flex-direction:column;gap:3px;}
  .cell-title .med{font-weight:700;font-size:14.5px;color:var(--ink);}
  .cell-title .qty{font-size:12.5px;color:var(--ink-soft);}
  .cell-client{display:flex;flex-direction:column;gap:3px;}
  .cell-client .name{font-weight:600;}
  .cell-client .phone{font-size:12.5px;color:var(--ink-soft);}
  .cell-meta{font-size:12.5px;color:var(--ink-soft);display:flex;flex-direction:column;gap:3px;}
  .cell-meta b{color:var(--ink);font-weight:600;}
  .badge{
    display:inline-flex;align-items:center;gap:5px;
    padding:4px 10px;border-radius:999px;font-size:11.5px;font-weight:700;
    width:fit-content;white-space:nowrap;
  }
  .badge-pendiente{background:var(--gold-soft);color:var(--gold);}
  .badge-apartado{background:var(--amber-soft);color:var(--amber);}
  .badge-enviado{background:#E3E8EE;color:#3B5170;}
  .badge-entregado{background:var(--sage-soft);color:var(--sage);}
  .days-pill{font-size:12px;font-weight:700;}
  .days-ok{color:var(--sage);}
  .days-warn{color:var(--amber);}
  .days-danger{color:var(--danger);}
  .row-actions{display:flex;gap:6px;}
  .obs-line{grid-column:1/-1;font-size:12.5px;color:var(--ink-soft);border-top:1px dashed var(--line);padding-top:8px;margin-top:2px;}

  /* Drawer / form */
  .overlay{
    position:fixed;inset:0;background:rgba(18,48,40,0.35);
    display:none;align-items:stretch;justify-content:flex-end;z-index:50;
  }
  .overlay.open{display:flex;}
  .drawer{
    width:min(440px,100%);
    background:var(--paper-raised);
    height:100%;
    padding:26px 26px 100px;
    overflow-y:auto;
    box-shadow:-12px 0 30px rgba(0,0,0,0.15);
    animation:slidein .18s ease;
  }
  @keyframes slidein{from{transform:translateX(24px);opacity:0;}to{transform:translateX(0);opacity:1;}}
  .drawer h2{font-size:20px;margin-bottom:4px;}
  .drawer .sub{font-size:12.5px;color:var(--ink-soft);margin-bottom:20px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;}
  .field input,.field select,.field textarea{
    width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:var(--radius-s);
    font-family:'Inter',sans-serif;font-size:13.5px;background:#FBFCFB;color:var(--ink);
  }
  .field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--teal);outline-offset:1px;}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .field textarea{resize:vertical;min-height:60px;}
  .drawer-actions{
    position:sticky;bottom:-100px;background:var(--paper-raised);
    display:flex;gap:10px;padding-top:14px;margin-top:6px;border-top:1px solid var(--line);
  }
  .close-x{position:absolute;top:22px;right:22px;background:none;border:none;font-size:20px;cursor:pointer;color:var(--ink-soft);}

  .toast{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
    background:var(--teal-deep);color:#fff;padding:11px 18px;border-radius:var(--radius-s);
    font-size:13px;font-weight:600;box-shadow:var(--shadow);z-index:80;
    opacity:0;pointer-events:none;transition:opacity .2s ease, transform .2s ease;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}

  @media (max-width:880px){
    .row-card{grid-template-columns:1fr;}
    .row-actions{justify-content:flex-start;}
    .topbar{padding:16px 18px;}
    .stats,.controls,.content{padding-left:18px;padding-right:18px;}
  }

  .sync-pill{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);color:#EDF3EF;max-width:380px;}
  .sync-pill .dot{width:8px;height:8px;border-radius:50%;background:#7FD1A2;flex:none;}
  .sync-pill[data-st=saving] .dot,.sync-pill[data-st=pending] .dot{background:#F0B35E;}
  .sync-pill[data-st=blocked] .dot,.sync-pill[data-st=error] .dot{background:#F08A7B;}
  .sync-pill[data-st=reconnect] .dot{background:#AAB4BB;}
  .grid-sel{padding:9px 12px;border:1px solid var(--line);border-radius:var(--radius-s);background:var(--paper-raised);font-family:inherit;font-size:13px;}
  .sub-info{font-size:12.5px;color:var(--ink-soft);}
  .grid-wrap{overflow:auto;max-height:calc(100vh - 290px);background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius-m);}
  table.grid{border-collapse:collapse;width:max-content;min-width:100%;}
  .grid th{position:sticky;top:0;background:var(--teal-deep);color:#fff;font-size:12px;text-align:left;padding:9px 8px;z-index:1;white-space:nowrap;}
  .grid td{padding:0;border-bottom:1px solid var(--line);border-right:1px solid var(--line);}
  .grid td input,.grid td select{width:100%;min-width:110px;border:none;background:transparent;padding:8px;font:inherit;font-size:13px;color:var(--ink);}
  .grid td input:focus,.grid td select:focus{outline:2px solid var(--teal);outline-offset:-2px;background:#fff;}
  .grid td:nth-child(3) input{min-width:220px;} .grid td:nth-child(10) input{min-width:240px;}
</style>
</head>
<body>
<div id="app">

  <div class="topbar">
    <div class="brand">
      <h1>Medicamentos Pendientes</h1>
      <span id="subtitle">Cargando…</span>
    </div>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
      <div class="view-switch" id="viewSwitch">
        <button class="view-btn active" data-view="medicamentos">Medicamentos</button>
        <button class="view-btn" data-view="hoja">Hoja Excel</button>

      <button class="btn btn-ghost btn-sm" id="btnNewXls" title="Crear un Excel nuevo vinculado">Crear Excel</button>
      <button class="btn btn-ghost btn-sm" id="btnReconnect" style="display:none">Reconectar</button>
      <button class="btn btn-ghost btn-sm" id="btnUnlink" style="display:none">Desvincular</button>

  <div id="viewMedicamentos">

    <div class="controls">

  </div>

      <select id="gridFilter" class="grid-sel">
        <option value="activos">Pendientes activos</option><option value="todos">Todos</option>
        <option value="pendiente">Pendiente</option><option value="apartado">Apartado</option>
        <option value="enviado">Enviado al tramo</option><option value="entregado">Entregado</option>
      </select>
      <button class="btn btn-primary" id="btnAddRow">+ Agregar fila</button>
      <span class="sub-info" id="gridInfo"></span>
    </div>
    <div class="content">
      <div class="grid-wrap"><table class="grid"><thead id="gridHead"></thead><tbody id="gridBody"></tbody></table></div>
      <button class="btn btn-outline" id="gridMore" style="display:none;margin-top:12px;">Mostrar más filas</button>
    </div>
  </div>
  <datalist id="empList"></datalist>

  <div id="viewEmpleados" style="display:none;">
    <div class="stats" id="statsEmp"></div>

    <div class="controls">
      <div class="search-box">
        <span>🔍</span>
        <input type="text" id="searchEmp" placeholder="Buscar empleado por nombre, cargo o teléfono…">
      </div>
    </div>

    <div class="content">
      <div class="list" id="listEmp"></div>
    </div>
  </div>

</div>

<div class="overlay" id="overlay">
  <div class="drawer">
    <button class="close-x" id="btnClose">✕</button>
    <h2 id="drawerTitle">Registrar medicamento</h2>
    <div class="sub">Los campos marcados quedan guardados en el sistema de pendientes.</div>
    <form id="recordForm">
      <div class="field-row">
        <div class="field">
          <label>Dependiente</label>
          <select id="f_dependiente" required>
            <option value="">Selecciona un dependiente…</option>

        </div>

        <div class="field">
          <label>Factura</label>

      <div class="field-row">
        <div class="field">
          <label>Nombre del cliente</label>
          <input type="text" id="f_cliente" required>

          <label>Teléfono</label>
          <input type="text" id="f_telefono" placeholder="809-000-0000">

      <div class="field-row">
        <div class="field">
          <label>Autorizado</label>
          <input type="text" id="f_autorizado" placeholder="ej. NELSON/DIST.">
        </div>
        <div class="field">
          <label>Estado</label>
          <select id="f_estado">
            <option value="pendiente">Pendiente</option>
            <option value="apartado">Apartado</option>
            <option value="enviado">Enviado al tramo</option>
            <option value="entregado">Entregado</option>
          </select>
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Fecha de entrega (estimada)</label>
          <input type="date" id="f_fechaEntrega">
        </div>
        <div class="field">
          <label>Hora</label>
          <input type="text" id="f_hora" placeholder="TARDE / MAÑANA">
        </div>
      </div>
      <div class="field">
        <label>Observaciones</label>
        <textarea id="f_observaciones"></textarea>
      </div>
      <div class="drawer-actions">
        <button type="submit" class="btn btn-primary" style="flex:1;">Guardar</button>
        <button type="button" class="btn btn-outline" id="btnDelete" style="display:none;">Eliminar</button>
      </div>
    </form>
  </div>
</div>

<div class="overlay" id="overlayEmp">
  <div class="drawer">
    <button class="close-x" id="btnCloseEmp">✕</button>
    <h2 id="drawerTitleEmp">Nuevo empleado</h2>
    <div class="sub">Estos empleados aparecerán como sugerencia al registrar un medicamento.</div>
    <form id="empForm">
      <div class="field">
        <label>Nombre completo</label>
        <input type="text" id="e_nombre" required>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Cargo</label>

        </div>

          <label>Teléfono</label>

        <label>Estado</label>
        <select id="e_activo">
          <option value="1">Activo</option>

      <div class="field">
        <label>Notas</label>
        <textarea id="e_notas"></textarea>
      </div>
      <div class="drawer-actions">
        <button type="submit" class="btn btn-primary" style="flex:1;">Guardar</button>
        <button type="button" class="btn btn-outline" id="btnDeleteEmp" style="display:none;">Eliminar</button>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* === SEED_PLACEHOLDER === */
const SEED = {"records": [], "historicoEntregados": 0};
/* === END_SEED === */

/* === ALMACENAMIENTO: usa window.storage si existe (Claude); si no, localStorage; si no, memoria === */
(function(){
  if(window.storage && typeof window.storage.get === "function") return;
  const mem = {};
  let ls = null;
  try{ localStorage.setItem("__t","1"); localStorage.removeItem("__t"); ls = localStorage; }catch(e){ ls = null; }
  window.storage = {
    async get(k){
      const v = ls ? ls.getItem(k) : (k in mem ? mem[k] : null);
      if(v === null || v === undefined) throw new Error("not found");
      return {key:k, value:v, shared:false};
    },
    async set(k,v){ if(ls) ls.setItem(k,v); else mem[k]=v; return {key:k, value:v, shared:false}; },
    async delete(k){ if(ls) ls.removeItem(k); else delete mem[k]; return {key:k, deleted:true, shared:false}; },
    async list(prefix){
      const keys = ls ? Object.keys(ls) : Object.keys(mem);
      return {keys: keys.filter(x=>!prefix || x.startsWith(prefix)), prefix, shared:false};
    }
  };
})();


const STORAGE_KEY = "medicamentos:records";
const META_KEY = "medicamentos:meta";
let records = [];
let historicoEntregados = 0;
let currentTab = "activos";
let editingId = null;

const STORAGE_KEY_EMP = "medicamentos:empleados";
let employees = [];
let currentView = "medicamentos";
let editingEmpId = null;
const uidEmp = () => "emp-" + Date.now() + "-" + Math.random().toString(36).slice(2,8);

const $ = (sel) => document.querySelector(sel);
const fmtDate = (iso) => {
  if(!iso) return "—";
  const [y,m,d] = iso.split("-");
  if(!y||!m||!d) return iso;
  return `${d}/${m}/${y}`;
};
const todayISO = () => new Date().toISOString().slice(0,10);
const daysBetween = (isoStart) => {
  if(!isoStart) return null;
  const start = new Date(isoStart+"T00:00:00");
  const now = new Date(todayISO()+"T00:00:00");
  return Math.round((now-start)/86400000);
};
const uid = () => "rec-" + Date.now() + "-" + Math.random().toString(36).slice(2,8);

function showToast(msg, ms){
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>t.classList.remove("show"), ms || 2200);
}

async function loadData(){
  try{
    const res = await window.storage.get(STORAGE_KEY, false);
    if(res && res.value){
      records = JSON.parse(res.value);
      const meta = await window.storage.get(META_KEY, false).catch(()=>null);
      historicoEntregados = meta ? JSON.parse(meta.value).historicoEntregados : SEED.historicoEntregados;
    } else {
      records = SEED.records;
      historicoEntregados = SEED.historicoEntregados;
      await persist();
      await window.storage.set(META_KEY, JSON.stringify({historicoEntregados}), false);
    }
  }catch(e){
    records = SEED.records;
    historicoEntregados = SEED.historicoEntregados;
  }
  await loadEmployees();
  renderEmpleadosDatalist();
  render();
}

async function persist(){
  try{
    await window.storage.set(STORAGE_KEY, JSON.stringify(records), false);
    if(hasDirty()) queueSave();
  }catch(e){
    console.error("No se pudo guardar", e);
    showToast("No se pudo guardar. Intenta de nuevo.");
  }
}

async function loadEmployees(){
  try{
    const res = await window.storage.get(STORAGE_KEY_EMP, false);
    employees = res && res.value ? JSON.parse(res.value) : [];
  }catch(e){
    employees = [];
  }
}

async function persistEmployees(cacheOnly){
  try{
    await window.storage.set(STORAGE_KEY_EMP, JSON.stringify(employees), false);
    if(!cacheOnly){ empDirty = true; queueSave(); }
  }catch(e){
    console.error("No se pudo guardar empleados", e);

}

/* ===== IMPORTAR / EXPORTAR EXCEL ===== */
const POSITIONAL_FIELDS = ["dependiente","fechaInicio","medicamento","cantidad","telefono","cliente","autorizado","fechaEntrega","hora","observaciones","factura"];

// Reconoce columnas por el nombre del encabezado (sin importar orden, tildes ni mayúsculas)
const HEADER_RULES = [
  [/^id$|^idregistro$|^codigo$/, "id"],
  [/^entregadoel|fechareal|entregareal/, "fechaEntregaReal"],
  [/fecha.*(entrega|prometida|retiro)|^entrega|fechaent/, "fechaEntrega"],
  [/^fecha|fechaini|fechapedido|fecharegistro|fechaapart/, "fechaInicio"],
  [/hora/, "hora"],
  [/telef|celular|^tel$|whatsapp|contacto/, "telefono"],
  [/factura|^ncf|ticket|recibo|^fact$|nofac/, "factura"],
  [/^estado|^estatus/, "estado"],
  [/observ|^nota|coment|^obs$/, "observaciones"],
  [/medic|producto|descrip|articulo|^med$/, "medicamento"],
  [/^cant|^qty|unidades/, "cantidad"],
  [/autoriz/, "autorizado"],
  [/client|paciente|^nombre/, "cliente"],
  [/depend|empleado|vendedor|atendi/, "dependiente"],
];

const ESTADO_LABELS = {pendiente:"Pendiente", apartado:"Apartado", enviado:"Enviado al tramo", entregado:"Entregado"};

function normHeader(s){
  return (s==null ? "" : s).toString().toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-z0-9]/g,"");
}

function mapHeaders(row){
  const map = {};
  (row||[]).forEach((h,i)=>{
    const n = normHeader(h);
    if(!n) return;
    for(const [re, field] of HEADER_RULES){
      if(re.test(n)){ if(map[field]===undefined) map[field]=i; break; }
    }
  });
  return map;
}

const pad2 = (n)=> String(n).padStart(2,"0");

function excelDateToISO(v){
  if(v===null || v===undefined || v==="") return "";
  if(v instanceof Date && !isNaN(v)) return v.toISOString().slice(0,10);
  if(typeof v === "number"){
    if(v > 20000 && v < 80000) return new Date(Math.round((v-25569)*86400000)).toISOString().slice(0,10);
    return "";
  }
  const s = v.toString().trim();
  let m = s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/);
  if(m) return `${m[1]}-${pad2(m[2])}-${pad2(m[3])}`;
  m = s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})/);
  if(m){
    let d = +m[1], mo = +m[2], y = +m[3];
    if(y < 100) y += 2000;
    if(mo > 12 && d <= 12){ const t=d; d=mo; mo=t; }
    if(mo<1 || mo>12 || d<1 || d>31) return "";
    return `${y}-${pad2(mo)}-${pad2(d)}`;
  }
  if(/^\d{5}$/.test(s)) return excelDateToISO(Number(s));
  return "";
}

function isoToSerial(iso){
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso||"");
  if(!m) return "";
  return Math.floor(Date.UTC(+m[1],+m[2]-1,+m[3])/86400000) + 25569;
}

function cellText(v){
  if(v===null || v===undefined) return "";
  if(v instanceof Date) return isNaN(v) ? "" : v.toISOString().slice(0,10);
  return v.toString().trim();
}

function excelTimeToStr(v){
  if(typeof v === "number" && v >= 0 && v < 1){
    const mins = Math.round(v*1440);
    return `${pad2(Math.floor(mins/60)%24)}:${pad2(mins%60)}`;
  }
  return cellText(v);
}

function parseEstado(txt){
  const u = (txt||"").toString().toUpperCase();
  if(!u) return "";
  if(u.includes("ENTREG") || u.includes("ENTRGAD") || u.includes("EBTREGAD")) return "entregado";
  if(u.includes("APART")) return "apartado";
  if(u.includes("TRAMO") || u.includes("ENV")) return "enviado";
  if(u.includes("PEND")) return "pendiente";
  return "";
}

/* Lee las filas de una hoja. Devuelve {nuevos, stats}. Los registros ya existentes se MODIFICAN (por ID o por factura+medicamento+cliente+fecha). */
function parseImportRows(rows, state){
  const stats = {leidas:0, nuevos:0, actualizados:0, sinCambios:0, entregados:0, sinDatos:0, modo:"", columnas:{}};
  const nuevos = [];

  let headerIdx = -1, bestMap = {}, bestCount = 0;
  for(let i=0; i<Math.min(rows.length, 15); i++){
    const map = mapHeaders(rows[i]);
    const c = Object.keys(map).length;
    if(c > bestCount){ bestCount = c; bestMap = map; headerIdx = i; }
  }
  let colMap, startRow;
  if(bestCount >= 3){ colMap = bestMap; startRow = headerIdx + 1; stats.modo = "encabezados"; }
  else{ colMap = {}; POSITIONAL_FIELDS.forEach((f,i)=> colMap[f]=i); startRow = 1; stats.modo = "posición"; }
  stats.columnas = colMap;
  const get = (row, f)=> colMap[f]===undefined ? "" : row[colMap[f]];
  const mkKey = (f,m,c,d)=> f+"|"+m+"|"+c+"|"+d;

  for(let i=startRow; i<rows.length; i++){
    const row = rows[i];
    if(!row || !row.some(c => cellText(c) !== "")) continue;
    stats.leidas++;

    const medicamento = cellText(get(row,"medicamento"));
    const cliente = cellText(get(row,"cliente"));
    if(!medicamento && !cliente){ stats.sinDatos++; continue; }

    const obs = cellText(get(row,"observaciones"));
    const estadoCol = parseEstado(cellText(get(row,"estado")));
    const estadoObs = parseEstado(obs);
    const entregadoPorObs = /^(ENTREGAD|ENTRGAD|EBTREGAD)/.test(obs.toUpperCase());
    const factura = cellText(get(row,"factura"));
    const fechaInicio = excelDateToISO(get(row,"fechaInicio"));
    const idCol = cellText(get(row,"id"));
    const key = mkKey(factura,medicamento,cliente,fechaInicio);

    const incoming = {
      dependiente: cellText(get(row,"dependiente")),
      fechaInicio, medicamento,
      cantidad: cellText(get(row,"cantidad")),
      telefono: cellText(get(row,"telefono")),
      cliente,
      autorizado: cellText(get(row,"autorizado")),
      fechaEntrega: excelDateToISO(get(row,"fechaEntrega")),
      hora: excelTimeToStr(get(row,"hora")),
      observaciones: obs,
      factura,
    };

    let estado = estadoCol || (entregadoPorObs ? "entregado" : (estadoObs && estadoObs !== "entregado" ? estadoObs : "pendiente"));
    if(estadoCol === "" && estadoObs === "entregado" && !entregadoPorObs) estado = "pendiente";

    // ¿Existe ya en el sistema?
    const match = (idCol && state.byId.get(idCol)) || state.byKey.get(key);

    if(match){
      let changed = false;
      for(const [f,v] of Object.entries(incoming)){
        if(v !== "" && v !== (match[f]||"")){ match[f] = v; changed = true; }
      }
      const explicitEstado = estadoCol || (entregadoPorObs ? "entregado" : (estadoObs || ""));
      if(explicitEstado && explicitEstado !== match.estado){
        match.estado = explicitEstado;
        if(explicitEstado === "entregado" && !match.fechaEntregaReal){
          match.fechaEntregaReal = excelDateToISO(get(row,"fechaEntregaReal")) || todayISO();
        }
        if(explicitEstado !== "entregado") match.fechaEntregaReal = "";
        changed = true;
      }
      if(changed) stats.actualizados++; else stats.sinCambios++;
      continue;
    }

    // Registro nuevo: los ya entregados no se agregan
    if(estado === "entregado"){ stats.entregados++; continue; }

    const rec = {id: uid(), ...incoming, estado, fechaEntregaReal:""};
    nuevos.push(rec);
    state.byKey.set(key, rec);
    state.byId.set(rec.id, rec);
  }
  stats.nuevos = nuevos.length;
  return {nuevos, stats};
}

function loadScript(src){

}

/* ===== EXPORTAR: crea un Excel nuevo con los datos actuales del sistema ===== */
function buildSheet(headers, rowsData, dateCols, widths){
  const ws = window.XLSX.utils.aoa_to_sheet([headers, ...rowsData]);
  const range = window.XLSX.utils.decode_range(ws["!ref"]);
  for(let R = 1; R <= range.e.r; R++){
    for(const C of dateCols){
      const cell = ws[window.XLSX.utils.encode_cell({r:R, c:C})];
      if(cell && cell.t === "n") cell.z = "dd/mm/yyyy";
    }
  }
  ws["!cols"] = widths.map(w => ({wch:w}));
  ws["!autofilter"] = {ref: ws["!ref"]};
  ws["!freeze"] = {xSplit:0, ySplit:1};
  return ws;
}

    if(await h.queryPermission({mode:"readwrite"})==="granted") await attach(h,"restore");
    else{ pendingHandle=h; setSync("reconnect"); }
  }catch(e){ console.warn("restore",e); }
}

/* ===== HOJA EDITABLE (como Excel, guarda en vivo) ===== */
const GCOLS=[["dependiente","Dependiente","dep"],["fechaInicio","Fecha","date"],["medicamento","Medicamento"],["cantidad","Cantidad"],["telefono","Teléfono"],["cliente","Cliente"],["autorizado","Autorizado"],["fechaEntrega","F. entrega","date"],["hora","Hora"],["observaciones","Observaciones"],["factura","Factura"],["estado","Estado","estado"],["fechaEntregaReal","Entregado el","date"]];
let gridLimit=300, gridStale=false, gridT=null;
$("#gridHead").innerHTML="<tr>"+GCOLS.map(c=>`<th>${c[1]}</th>`).join("")+"<th></th></tr>";
function gridList(){
  const q=$("#searchGrid").value.trim().toLowerCase(), f=$("#gridFilter").value;
  return records.filter(r=>(f==="todos"||(f==="activos"?r.estado!=="entregado":r.estado===f))&&(!q||[r.cliente,r.medicamento,r.dependiente,r.factura,r.telefono].some(x=>(x||"").toLowerCase().includes(q))))
    .sort((a,b)=>(b.fechaInicio||"").localeCompare(a.fechaInicio||""));
}
function renderGrid(force){
  const body=$("#gridBody");
  if(!force&&body.contains(document.activeElement)){ gridStale=true; return; }
  gridStale=false;
  const all=gridList(), list=all.slice(0,gridLimit);
  $("#gridInfo").textContent=`${list.length} de ${all.length} filas`;
  $("#gridMore").style.display=all.length>gridLimit?"":"none";
  const cell=(r,[k,,t])=>t==="estado"
    ? `<select data-k="${k}">${Object.entries(ESTADO_LABELS).map(([e,l])=>`<option value="${e}"${r.estado===e?" selected":""}>${l}</option>`).join("")}</select>`
    : `<input data-k="${k}" type="${t==="date"?"date":"text"}" value="${escapeHtml(r[k])}"${t==="dep"?' list="empList"':""}>`;
  body.innerHTML=list.map(r=>`<tr data-id="${r.id}">${GCOLS.map(c=>`<td>${cell(r,c)}</td>`).join("")}<td><button class="btn btn-outline btn-sm" data-del title="Eliminar fila">🗑</button></td></tr>`).join("");
}
function gridEdit(ev){
  const el=ev.target, k=el.dataset&&el.dataset.k; if(!k) return;
  const tr=el.closest("tr"), r=records.find(x=>x.id===tr.dataset.id); if(!r) return;
  r[k]=el.value;
  if(k==="estado"){
    r.fechaEntregaReal=el.value==="entregado"?(r.fechaEntregaReal||todayISO()):"";
    const i=tr.querySelector('[data-k="fechaEntregaReal"]'); if(i) i.value=r.fechaEntregaReal;
  }
  markDirty(r.id); if(fileHandle) setSync("pending"); renderStats();
  clearTimeout(gridT); gridT=setTimeout(persist,500);
}
$("#gridBody").addEventListener("input",gridEdit);
$("#gridBody").addEventListener("change",gridEdit);
$("#gridBody").addEventListener("focusout",()=>setTimeout(()=>{ if(gridStale&&!$("#gridBody").contains(document.activeElement)) renderGrid(); },0));
$("#gridBody").addEventListener("click",async ev=>{
  if(!ev.target.closest("[data-del]")) return;
  const id=ev.target.closest("tr").dataset.id;
  if(!confirm("¿Eliminar esta fila? También se borrará del Excel.")) return;
  records=records.filter(r=>r.id!==id); markDeleted(id); await persist(); renderStats(); renderGrid(true);
});
$("#btnAddRow").onclick=async()=>{
  const r={id:uid(),dependiente:"",fechaInicio:todayISO(),medicamento:"",cantidad:"",telefono:"",cliente:"",autorizado:"",fechaEntrega:"",hora:"",observaciones:"",factura:"",estado:"pendiente",fechaEntregaReal:""};
  records.unshift(r); markDirty(r.id);
  if($("#gridFilter").value==="entregado") $("#gridFilter").value="activos";
  $("#searchGrid").value=""; await persist(); renderStats(); renderGrid(true);
  const i=document.querySelector(`#gridBody tr[data-id="${r.id}"] [data-k="medicamento"]`); if(i){ i.scrollIntoView({block:"center"}); i.focus(); }
};
$("#searchGrid").addEventListener("input",()=>renderGrid(true));
$("#gridFilter").addEventListener("change",()=>{ gridLimit=300; renderGrid(true); });
$("#gridMore").onclick=()=>{ gridLimit+=300; renderGrid(true); };
setSync("none");

loadData().then(restoreHandle);
</script>
<!-- === EXPORTAR RESPALDO (Medicamentos Pendientes) === -->
<button id="btnExportarRespaldo" style="position:fixed;right:16px;bottom:16px;z-index:99999;padding:12px 18px;border:0;border-radius:8px;background:#B5651D;color:#fff;font:600 14px Inter,system-ui,sans-serif;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.25)">⬇ Guardar respaldo para el sistema nuevo</button>
<script>
document.getElementById("btnExportarRespaldo").onclick = async function(){
  const leer = async k => { try{ const r = await window.storage.get(k,false); return r && r.value ? JSON.parse(r.value) : null; }catch(e){ return null; } };
  const records = await leer("medicamentos:records") || [];
  const empleados = await leer("medicamentos:empleados") || [];
  const meta = await leer("medicamentos:meta") || {};
  if(!records.length && !empleados.length){ alert("No se encontraron datos en este navegador.\n\nAbre este archivo en el mismo navegador y la misma computadora donde usabas el sistema antiguo."); return; }
  const paquete = { formato:"medpend-export-v1", exportadoEn:new Date().toISOString(), equipo:location.href.slice(0,120),
    records, empleados, historicoEntregados:Number(meta.historicoEntregados)||0 };
  const blob = new Blob([JSON.stringify(paquete,null,2)],{type:"application/json"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = "respaldo-medicamentos-" + new Date().toISOString().slice(0,10) + ".json";
  document.body.appendChild(a); a.click(); a.remove();
  alert("Listo. Se guardó el archivo:\n" + a.download + "\n\nBúscalo en la carpeta Descargas. Cópialo a una memoria USB si lo vas a importar desde otra computadora.\n\nNo se borró nada del sistema antiguo.");
};
</script>
